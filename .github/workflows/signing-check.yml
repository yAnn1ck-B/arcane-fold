name: Check encrypted updater signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-updater-signing-check
  cancel-in-progress: false

jobs:
  signing-check:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out signing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked CLI dependencies
        run: npm ci
      - name: Prepare harmless public fixture
        run: node scripts/signing-check.mjs prepare
      - name: Sign fixture using encrypted repository secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/signing-check.mjs sign
      - name: Install checksum-pinned public signature verifier
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $archive -TimeoutSec 120
          $expected = '37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne $expected) {
            throw 'Official minisign 0.12 archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Join-Path $destination 'minisign-win64/x86_64/minisign.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw 'The verified archive has no x86_64 minisign executable.'
          }
          "MINISIGN_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify public key and authenticated signed version
        run: node scripts/signing-check.mjs verify
      - name: Save public boolean evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: encrypted-signing-check-${{ github.run_id }}
          path: ${{ runner.temp }}/eternal-league-signing-check/evidence.json
          if-no-files-found: error
          retention-days: 14
