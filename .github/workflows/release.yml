name: Draft desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate tag and signing readiness
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      signingMode: ${{ steps.signing.outputs.mode }}
      releaseId: ${{ steps.draft.outputs.releaseId }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Validate exact release tag and synchronized versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag || { echo 'Release builds require an existing vX.Y.Z tag.' >&2; exit 1; }
          node scripts/check-version.mjs --tag "$RELEASE_TAG"
      - name: Select release signing mode
        id: signing
        env:
          REQUESTED_SIGNING_MODE: ${{ vars.RELEASE_SIGNING_MODE || 'local' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const mode = process.env.REQUESTED_SIGNING_MODE;
          if (!['local', 'actions'].includes(mode)) throw new Error('RELEASE_SIGNING_MODE must be local or actions.');
          appendFileSync(process.env.GITHUB_OUTPUT, `mode=${mode}\n`);
          console.log(mode === 'local' ? 'Installers will be signed locally; no private key is sent to GitHub Actions.' : 'Using configured Actions signing secrets.');
          NODE
      - name: Require public updater configuration
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          if (config.bundle?.createUpdaterArtifacts !== true) throw new Error('Signed updater artifacts must be enabled in the release configuration.');
          if (!config.plugins?.updater?.pubkey?.trim()) throw new Error('The updater public key is missing.');
          if (config.plugins?.updater?.requireSignedVersion !== true) throw new Error('Signed updater versions must be required.');
          if (!config.plugins?.updater?.endpoints?.length) throw new Error('The updater endpoint is missing.');
          NODE
      - name: Require Actions signing secrets only when explicitly enabled
        if: steps.signing.outputs.mode == 'actions'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          for (const name of ['TAURI_SIGNING_PRIVATE_KEY', 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD']) {
            if (!process.env[name]?.trim()) throw new Error(`Missing required release secret: ${name}`);
          }
          NODE

      - name: Create or reuse one unpublished draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const repository = process.env.GITHUB_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) || !/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid release repository or tag.');
          const api = async (path, body) => {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, {
              method: body ? 'POST' : 'GET',
              headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
              ...(body ? { body: JSON.stringify(body) } : {}),
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Draft release API failed with status ${response.status}.`);
            return response.json();
          };
          let release;
          for (let page = 1; page <= 10; page++) {
            const releases = await api(`/releases?per_page=100&page=${page}`);
            if (!Array.isArray(releases)) throw new Error('Unexpected release list.');
            release = releases.find((item) => item.tag_name === tag);
            if (release || releases.length < 100) break;
            if (page === 10) throw new Error('Too many releases to safely locate this draft.');
          }
          if (!release) release = await api('/releases', {
            tag_name: tag, target_commitish: process.env.GITHUB_SHA,
            name: `Eternal League ${tag}`,
            body: 'Windows NSIS and Linux AppImage installers. League data is stored outside the installation and preserved on upgrades. Local updater signing and full verification are required before publication when local signing mode is selected.',
            draft: true, prerelease: false,
          });
          if (release.tag_name !== tag || release.draft !== true || release.prerelease !== false || !Number.isSafeInteger(release.id) || release.id <= 0) throw new Error('The target must be one unpublished stable draft for this exact tag.');
          appendFileSync(process.env.GITHUB_OUTPUT, `releaseId=${release.id}\n`);
          console.log(`Prepared unpublished draft ${release.id} for ${tag}.`);
          NODE

  package:
    name: Build draft (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Local mode uploads distinct installers to one precreated draft.
      # Actions signing still merges latest.json and must remain serialized.
      max-parallel: ${{ needs.preflight.outputs.signingMode == 'local' && 2 || 1 }}
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
            bundle: nsis
          - platform: linux-x86_64
            runner: ubuntu-22.04
            bundle: appimage
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xvfb
      - name: Install Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          rustup default 1.90.0
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test autosave, updater and release verification
        run: node --test scripts/deck-autosave.test.mjs scripts/updater.test.mjs scripts/database-retry.test.mjs scripts/verify-release.test.mjs scripts/release-version.test.mjs scripts/migration-policy.test.mjs
      - name: Validate tagged versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs --tag "$RELEASE_TAG"
      - name: Test native code (Windows)
        if: runner.os == 'Windows'
        run: npm test -- --locked
      - name: Test native code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --locked
      - name: Build and upload signed draft assets
        if: needs.preflight.outputs.signingMode == 'actions'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: node scripts/tauri.mjs
          releaseId: ${{ needs.preflight.outputs.releaseId }}
          releaseName: Eternal League v__VERSION__
          releaseBody: Windows NSIS and Linux AppImage installers. League data is stored outside the installation and preserved on upgrades.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: --ci --bundles ${{ matrix.bundle }} -- --locked
      - name: Build draft installers for local signing
        if: needs.preflight.outputs.signingMode == 'local'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: node scripts/tauri.mjs
          releaseId: ${{ needs.preflight.outputs.releaseId }}
          releaseName: Eternal League v__VERSION__
          releaseBody: Windows NSIS and Linux AppImage installers. Local updater signing and verification are required before publication.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: --ci --bundles ${{ matrix.bundle }} --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Smoke-test Linux installation and data preservation
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          SMOKE_REPORT: ${{ runner.temp }}/linux-install-smoke.json
        run: |
          python3 scripts/linux-install-smoke.py self-test
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1 || { echo 'Expected one built AppImage.' >&2; exit 1; }
          xvfb-run -a python3 scripts/linux-install-smoke.py "${appimages[0]}"
      - name: Save Linux installation smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-install-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-install-smoke.json
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare exact uploaded Linux signed-upgrade fixtures
        if: runner.os == 'Linux' && needs.preflight.outputs.signingMode == 'actions'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.preflight.outputs.releaseId }}
        run: |
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1 || { echo 'Expected one frozen release AppImage.' >&2; exit 1; }
          python3 scripts/linux-signed-upgrade.py self-test
          python3 scripts/linux-signed-upgrade.py prepare --tag "$RELEASE_TAG" --release-id "$RELEASE_ID" --local-appimage "${appimages[0]}"
      - name: Build verification-only native Linux updater probe
        if: runner.os == 'Linux' && needs.preflight.outputs.signingMode == 'actions'
        timeout-minutes: 12
        run: |
          # The release AppImage is already frozen/uploaded. This throwaway
          # example uses the existing dependency cache; app/config/lock files
          # and the signed installer are not changed or rebuilt.
          mkdir -p src-tauri/examples
          test ! -e src-tauri/examples/linux_release_updater_probe.rs
          cp scripts/linux-updater-probe.rs src-tauri/examples/linux_release_updater_probe.rs
          cargo build --manifest-path src-tauri/Cargo.toml --release --example linux_release_updater_probe --features tauri/test --locked
      - name: Verify real Linux signed upgrade and game-data preservation
        if: runner.os == 'Linux' && needs.preflight.outputs.signingMode == 'actions'
        timeout-minutes: 7
        env:
          LINUX_UPGRADE_REPORT: ${{ runner.temp }}/linux-signed-upgrade.json
        run: xvfb-run -a python3 scripts/linux-signed-upgrade.py exercise --probe src-tauri/target/release/examples/linux_release_updater_probe
      - name: Save Linux signed-upgrade evidence
        if: always() && runner.os == 'Linux' && needs.preflight.outputs.signingMode == 'actions'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-signed-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-signed-upgrade.json
          if-no-files-found: warn
          retention-days: 14

  verify-draft:
    name: Verify draft artifacts
    needs: [preflight, package]
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    # GitHub exposes draft releases only to callers with push access.
    permissions:
      contents: write
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install checksum-pinned public signature verifier
        if: needs.preflight.outputs.signingMode == 'actions'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'minisign-0.12'
          Invoke-WebRequest -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $archive -TimeoutSec 120
          $expected = '37B600344E20C19314B2E82813DB2BFDCC408B77B876F7727889DBD46D539479'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -cne $expected) {
            throw 'Official minisign 0.12 archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Join-Path $destination 'minisign-win64/x86_64/minisign.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw 'The verified archive has no x86_64 minisign executable.'
          }
          "MINISIGN_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Normalize generated updater manifest to public tagged URLs
        if: needs.preflight.outputs.signingMode == 'actions'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.preflight.outputs.releaseId }}
        run: |
          node --input-type=module <<'NODE'
          import { canonicalAssetUrl } from './scripts/release-assets.mjs';
          import { createReleaseRequest, decodeSignature, validateRelease } from './scripts/verify-release.mjs';
          const repository = process.env.GITHUB_REPOSITORY;
          const tag = process.env.RELEASE_TAG;
          const releaseId = Number(process.env.RELEASE_ID);
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) || !/^v\d+\.\d+\.\d+$/.test(tag) || !Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error('Invalid draft release coordinates.');
          const api = `https://api.github.com/repos/${repository}`;
          const request = createReleaseRequest(false, process.env.GH_TOKEN);
          const release = await request(`${api}/releases/${releaseId}`);
          if (release.id !== releaseId || release.tag_name !== tag || !release.draft || release.prerelease) throw new Error('Only the exact unpublished stable draft can be normalized.');
          const assets = await request(`${api}/releases/${releaseId}/assets?per_page=100`);
          const manifestAsset = assets.find(asset => asset.name === 'latest.json');
          if (!manifestAsset) throw new Error('Tauri action did not generate latest.json.');
          const original = JSON.parse(await request(manifestAsset.url, 'text'));
          if (original.version !== tag.slice(1)) throw new Error('Generated updater version does not match the tag.');
          const manifest = { ...original, platforms: {} };
          for (const [platform, extension] of [['windows-x86_64', '.exe'], ['linux-x86_64', '.AppImage']]) {
            const entry = original.platforms?.[platform];
            const matches = assets.filter(asset => asset.name.endsWith(extension) && asset.name.includes(tag.slice(1)) && [asset.url, canonicalAssetUrl(repository, tag, asset.name)].includes(entry?.url));
            if (matches.length !== 1) throw new Error(`Generated manifest has no unique installer for ${platform}.`);
            const payload = matches[0];
            const signatureAsset = assets.find(asset => asset.name === `${payload.name}.sig`);
            if (!signatureAsset) throw new Error(`Missing public signature for ${platform}.`);
            const signature = (await request(signatureAsset.url, 'text')).trim();
            if (entry?.signature?.trim() !== signature) throw new Error(`Generated manifest signature differs for ${platform}.`);
            decodeSignature(signature, tag.slice(1));
            manifest.platforms[platform] = { signature, url: canonicalAssetUrl(repository, tag, payload.name) };
          }
          // The pinned action emits API URLs and installer aliases. Publish the
          // same signatures under our two-platform public URL contract instead.
          validateRelease(release, assets, manifest, tag, false, repository);
          const change = async (url, options) => {
            const response = await fetch(url, {
              ...options, redirect: 'error', signal: AbortSignal.timeout(60000),
              headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28', ...options.headers },
            });
            if (!response.ok) throw new Error(`Draft manifest update failed with status ${response.status}.`);
          };
          await change(`${api}/releases/assets/${manifestAsset.id}`, { method: 'DELETE' });
          await change(`https://uploads.github.com/repos/${repository}/releases/${releaseId}/assets?name=latest.json`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(manifest, null, 2) + '\n',
          });
          console.log('Normalized only latest.json to canonical tagged URLs; installers and version-bound signatures are unchanged.');
          NODE
      - name: Verify both installers and matching updater signatures
        if: needs.preflight.outputs.signingMode == 'actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs --tag "$RELEASE_TAG"
      - name: Verify complete unsigned draft for local signing
        if: needs.preflight.outputs.signingMode == 'local'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/verify-release.mjs --tag "$RELEASE_TAG" --unsigned
          echo '## Local signing required' >> "$GITHUB_STEP_SUMMARY"
          echo 'The draft contains both installers. Sign them locally, upload public .sig files and latest.json, and run full verification before publishing. The private signing key stays on the maintainer computer.' >> "$GITHUB_STEP_SUMMARY"
