name: Isolated Linux signed upgrade QA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-signed-upgrade-qa
  cancel-in-progress: false

jobs:
  signed-upgrade:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out isolated QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Confirm production sources still match the immutable tag
        run: git diff --exit-code v0.2.0 -- src src-tauri package.json package-lock.json scripts
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux dependencies and public signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xvfb minisign
      - name: Install Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - name: Set isolated QA paths
        run: |
          echo "LINUX_QA_PAYLOAD_DIR=$RUNNER_TEMP/linux-upgrade-payload" >> "$GITHUB_ENV"
          echo "LINUX_QA_OLD_CONFIG=$RUNNER_TEMP/linux-upgrade-old.json" >> "$GITHUB_ENV"
          echo "LINUX_QA_REPORT=$RUNNER_TEMP/linux-signed-upgrade.json" >> "$GITHUB_ENV"
      - name: Download existing unsigned CI AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43914055166 --repo "$GITHUB_REPOSITORY" --name unsigned-linux-x86_64 --dir "$LINUX_QA_PAYLOAD_DIR"
      - name: Verify public signature and prepare old QA configuration
        run: python3 qa/linux-upgrade-qa.py prepare
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build genuine old 0.1.9 QA AppImage without signing keys
        run: npm run tauri -- build --ci --bundles appimage --config "$LINUX_QA_OLD_CONFIG" -- --locked
      - name: Compile native updater probe
        run: |
          mkdir -p src-tauri/examples
          cp qa/linux-updater-probe.rs src-tauri/examples/linux_updater_probe.rs
          cargo build --manifest-path src-tauri/Cargo.toml --release --example linux_updater_probe --features tauri/test --locked
      - name: Execute signed native upgrade and data preservation checks
        timeout-minutes: 4
        run: xvfb-run -a python3 qa/linux-upgrade-qa.py exercise
      - name: Save non-secret upgrade evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-signed-upgrade-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-signed-upgrade.json
          if-no-files-found: warn
          retention-days: 14
