name: Web CI

on:
  push:
    branches: [main, master, experiment/web-multiplayer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: arcane_fold_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/arcane_fold_test
      TEST_WEB_POSTGRES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Set up JDK 17 and Forge 2.0.13
        shell: bash
        run: |
          "$JAVA_HOME_17_X64/bin/javac" -version
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
          printf 'WEB_PLAYER_LOGINS_FILE=%s/arcane-fold-player-logins.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

          install=$(bash deploy/azure/install-forge.sh "$RUNNER_TEMP/forge-2.0.13")
          printf 'FORGE_INSTALL=%s\n' "$install" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npm run web:db
      - run: npm test
