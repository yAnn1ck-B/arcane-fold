name: Desktop CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Test and package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
            bundle: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - platform: linux-x86_64
            runner: ubuntu-22.04
            bundle: appimage
            artifacts: src-tauri/target/release/bundle/appimage/*.AppImage
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: '1'
      CI_BUNDLE_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xvfb
      - name: Install Rust 1.90
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          rustup default 1.90.0
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check versions and release identity
        run: node scripts/check-version.mjs
      - name: Test autosave, updater and release verification
        run: node --test scripts/deck-autosave.test.mjs scripts/updater.test.mjs scripts/database-retry.test.mjs scripts/verify-release.test.mjs scripts/release-version.test.mjs scripts/migration-policy.test.mjs
      - name: Test manual play and saved table replay
        run: npm run test:playtest
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Test native code (Windows)
        if: runner.os == 'Windows'
        run: npm test -- --locked
      - name: Test native code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --locked
      - name: Build frontend
        run: npm run build
      # Pull requests never receive signing secrets or create releases.
      - name: Build unsigned installer
        env:
          BUNDLE: ${{ matrix.bundle }}
        run: npm run tauri -- build --ci --bundles "$BUNDLE" --config "$CI_BUNDLE_CONFIG" -- --locked
      - name: Smoke-test Linux installation and data preservation
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          SMOKE_REPORT: ${{ runner.temp }}/linux-install-smoke.json
        run: |
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#appimages[@]}" -eq 1 || { echo 'Expected one built AppImage.' >&2; exit 1; }
          xvfb-run -a python3 scripts/linux-install-smoke.py "${appimages[0]}"
      - name: Save Linux installation smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-install-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-install-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save installer for inspection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unsigned-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
